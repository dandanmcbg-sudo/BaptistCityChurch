<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church Planner — Baptist City Church</title><script src="firebase-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ef;color:#29241f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.shell{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:100vh}aside{background:#181818;color:white;padding:20px 12px}.brand{display:flex;gap:9px;align-items:center;margin-bottom:28px;font-size:12px}.brand img{width:34px;height:34px;border-radius:9px}nav a{display:block;color:#ddd;text-decoration:none;padding:12px 10px;border-radius:9px;font-size:13px}nav a.active,nav a:hover{background:#35312f;color:white}main{padding:22px;min-width:0}header{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:15px}h1{font-size:24px;margin:0}p{margin:5px 0;color:#81796f;font-size:13px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid #ded5cc;background:#fff;border-radius:9px;padding:10px 13px;font:inherit;cursor:pointer}button.primary{background:#201b1a;color:white;border-color:#201b1a}button.selected{background:#eae3fb;border-color:#9174e6;color:#4b3692}input,select,textarea{border:1px solid #ded5cc;border-radius:8px;padding:10px;font:inherit;width:100%}input[type=search]{max-width:230px}label{font-size:13px;display:block;margin:12px 0 5px;font-weight:650}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid #e4ded6;border-radius:14px;overflow:hidden}.weekday{padding:12px;text-align:center;background:#faf8f5;border-bottom:1px solid #eee7df;color:#776e65;font-size:12px;font-weight:700}.day{min-width:0;min-height:116px;border-right:1px solid #eee9e2;border-bottom:1px solid #eee9e2;padding:8px;cursor:pointer}.day:hover{background:#f9f6ff}.day.outside{background:#f8f7f5;color:#aaa}.day.today .day-number{color:#7254d2;font-weight:800}.day-number{font-size:13px;display:flex;justify-content:space-between}.add-small{opacity:0}.day:hover .add-small{opacity:1}.event-chip{display:block;text-align:left;width:100%;font-size:11px;padding:6px;margin:4px 0;background:color-mix(in srgb,var(--chip) 13%,white);color:#29241f;border:0;border-left:4px solid var(--chip);border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab}.event-chip[hidden]{display:none}.calendar-grid.week .day{min-height:65vh}.calendar-grid.day{grid-template-columns:1fr}.calendar-grid.day .day{min-height:65vh}.calendar-grid.day .event-chip{font-size:14px;padding:12px}.status{font-size:12px;color:#6d6258;margin-top:12px}dialog{border:1px solid #e5ddd3;border-radius:18px;padding:0;width:min(520px,94vw);max-height:90vh;box-shadow:0 25px 80px #0004}dialog::backdrop{background:#15151580}.dialog-inner{padding:24px;overflow:auto;max-height:90vh}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}body:not(.ready) main{visibility:hidden}#eventsList{display:none}@media(max-width:750px){.shell{grid-template-columns:1fr}aside{padding:10px}nav{display:flex;overflow:auto}.brand{margin-bottom:8px}main{padding:12px}.day{min-height:82px;padding:4px}.event-chip{font-size:9px}.toolbar{gap:5px}.grid{grid-template-columns:1fr}}

/* v13: native, full-width premium planner (no embedded iframe or duplicate sidebar) */
:root{--purple:#4c3ab4;--line:#e8e2dd;--paper:#fff}
body{background:#faf8f6;color:#25212c}.shell{grid-template-columns:220px minmax(0,1fr)}aside{background:#1c1c23;padding:22px 14px}nav a{padding:13px 15px;margin:4px 0;border-radius:10px}nav a.active{background:#4537a7;color:#fff}main{padding:24px 26px;max-width:none;width:100%;overflow:visible}h1{font-size:28px;letter-spacing:-.6px}header{margin-bottom:22px}header p{font-size:14px}button.primary,button.selected{background:var(--purple);color:white;border-color:var(--purple)}button{transition:background .15s,border-color .15s}button:hover{border-color:#a89be2}.planner-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}.planner-main,.planner-panel>section{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 16px #2b194008}.planner-main{padding:16px;min-width:0}.planner-panel{display:grid;gap:14px;background:transparent;color:inherit;padding:0}.planner-panel>section{padding:18px}.planner-panel h2{font-size:15px;margin:0 0 14px}.toolbar{margin-bottom:14px}.toolbar #period{font-size:18px;min-width:160px}.calendar-grid{border-radius:10px}.calendar-grid.month .day{min-height:clamp(105px,14vh,170px)}.weekday{font-size:12px}.day{position:relative}.day-number{font-weight:700}.day.today .day-number{color:var(--purple)}.event-chip{border-left-width:3px;white-space:normal;line-height:1.3;padding:7px}.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mini-grid button{padding:7px 0;border:0;font-size:12px;border-radius:50%;min-width:0}.mini-grid button.mini-selected{background:var(--purple);color:#fff}.mini-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mini-head button{padding:5px 9px}.upcoming-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.upcoming-item:last-child{border-bottom:0}.upcoming-dot,.legend-dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}.upcoming-item strong{display:block;font-size:12px}.upcoming-item small{display:block;color:#777;font-size:11px;margin-top:3px}.legend-row{display:flex;gap:10px;align-items:center;font-size:12px;padding:7px 0}.legend-dot{margin:0}.status{margin:10px 0 0}.dialog-inner h2{font-size:20px}#eventDialog button[type=submit]{background:var(--purple);color:#fff;border-color:var(--purple)}
@media(max-width:1120px){.planner-layout{grid-template-columns:minmax(0,1fr) 235px}.shell{grid-template-columns:180px minmax(0,1fr)}main{padding:18px}.planner-panel>section{padding:12px}}
@media(max-width:900px){.planner-layout{grid-template-columns:1fr}.planner-panel{grid-template-columns:repeat(2,minmax(0,1fr))}.planner-panel>section:last-child{grid-column:1/-1}}
@media(max-width:750px){.shell{grid-template-columns:1fr}.planner-panel{grid-template-columns:1fr}.planner-panel>section:last-child{grid-column:auto}main{padding:12px}.calendar-grid.month .day{min-height:82px}}
</style></head><body><div class="shell"><aside><div class="brand"><img src="assets/bcc-logo.png" alt="BCC"><strong>Baptist City Church<br>Admin Portal</strong></div><nav><a href="admin.html">Dashboard</a><a href="events.html" class="active" aria-current="page">Church Planner</a><a href="invitation.html">Invitation Center</a><a href="automation.html">Email Automation</a></nav></aside><main><header><div><h1>Church Planner</h1><p>Full-screen interactive calendar · Events saved to Firebase</p></div><button id="newEvent" class="primary">＋ Create Event</button></header><div class="planner-layout"><section class="planner-main"><div class="toolbar"><button id="today">Today</button><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button><strong id="period" style="min-width:170px"></strong><button data-mode="month">Month</button><button data-mode="week">Week</button><button data-mode="day">Day</button><input type="search" id="search" placeholder="Search visible events" aria-label="Search events"></div><div id="calendarGrid" class="calendar-grid" aria-label="Church event calendar"></div><div id="eventStatus" class="status" aria-live="polite">Connecting to Firebase…</div><div id="eventsList"></div></section><aside class="planner-panel" aria-label="Planner overview"><section><div class="mini-head"><h2 style="margin:0">Quick Calendar</h2><div><button id="miniPrev" type="button" aria-label="Previous month">‹</button><button id="miniNext" type="button" aria-label="Next month">›</button></div></div><strong id="miniTitle" style="display:block;text-align:center;font-size:13px;margin-bottom:12px"></strong><div id="miniGrid" class="mini-grid"></div></section><section><h2>Upcoming Events</h2><div id="upcomingItems" aria-live="polite">No upcoming events yet.</div></section><section><h2>Event Categories</h2><div id="eventLegend"></div></section></aside></div><span id="upcoming" hidden></span><span id="monthCount" hidden></span><dialog id="eventDialog"><div class="dialog-inner"><div class="row" style="justify-content:space-between"><h2 id="formTitle">Add Church Event</h2><button id="closeDialog" type="button">✕</button></div><form id="eventForm"><input type="hidden" id="eventId"><label for="name">Event name</label><input id="name" maxlength="120" required placeholder="Sunday Worship Service"><label for="type">Event type</label><select id="type"><option>Sunday Worship</option><option>Prayer Meeting</option><option>Fellowship</option><option>Special Service</option><option>Other</option></select><div class="grid"><div><label for="date">Date</label><input id="date" type="date" required></div><div><label for="time">Time</label><input id="time" type="time" required></div></div><label for="venue">Location</label><input id="venue" maxlength="150" value="Baptist City Church" required><label for="message">Invitation message</label><textarea id="message" rows="3" maxlength="2000" placeholder="We would love to see you!"></textarea><div class="row" style="margin-top:14px"><button type="submit" id="save">Save Event</button><button type="button" class="secondary" id="reset">Clear</button></div><div class="row" style="margin-top:12px"><button type="button" id="inviteFromPlanner">Create Invitation</button><button type="button" id="deleteFromPlanner">Delete Event</button></div></form></div></dialog></main></div><script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import {getFirestore,collection,doc,getDocs,setDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const UID='tSirLJ49mPTM2wo7kpmAxbqT7Rj2',$=id=>document.getElementById(id);let records=[],ready=false;
const app=getApps().length?getApp():initializeApp(window.BCC_FIREBASE_CONFIG),db=getFirestore(app);
onAuthStateChanged(getAuth(app),u=>{if(!u||u.uid!==UID){location.replace('admin.html');return}ready=true;document.body.classList.add('ready');load()});
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pretty(d){const [y,m,day]=d.split('-').map(Number);return new Date(Date.UTC(y,m-1,day)).toLocaleDateString('en-US',{timeZone:'UTC',month:'long',day:'numeric',year:'numeric'})}
function prettyTime(t){const [h,m]=t.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')}
async function load(){if(!ready)return;renderCalendar();$('eventStatus').textContent='Loading saved church events…';$('eventsList').textContent='Loading…';try{const snap=await getDocs(collection(db,'churchEvents'));records=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time));render();$('eventStatus').textContent='Calendar synced with Firebase.'}catch(e){$('eventsList').textContent='Could not load events: '+e.message;$('eventStatus').textContent='Calendar is available, but saved events could not load: '+e.message+'. Check Firestore churchEvents rules.'}}
function render(){renderCalendar();const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const future=records.filter(e=>e.date>=today);$('upcoming').textContent=future.length;$('monthCount').textContent=records.filter(e=>e.date.startsWith(today.slice(0,7))).length;$('eventsList').innerHTML=future.length?future.map(e=>`<article style="padding:14px 0;border-bottom:1px solid #eee7df"><div class="row"><span class="pill">${esc(e.type)}</span><strong>${esc(e.name)}</strong></div><p class="muted">📅 ${pretty(e.date)} &nbsp; 🕒 ${prettyTime(e.time)} &nbsp; 📍 ${esc(e.venue)}</p><div class="row"><button class="secondary" data-edit="${esc(e.id)}">Edit</button><button class="secondary" data-invite="${esc(e.id)}">Use in Invitation Center</button><button class="secondary" data-delete="${esc(e.id)}">Delete</button></div></article>`).join(''):'<p class="muted">No upcoming events yet.</p>'}
$('eventsList').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.invite||b.dataset.delete;const item=records.find(x=>x.id===id);if(!item)return;if(b.dataset.edit){for(const k of ['name','type','date','time','venue','message'])$(k).value=item[k]||'';$('eventId').value=item.id;$('formTitle').textContent='Edit Church Event';window.scrollTo({top:0,behavior:'smooth'})}if(b.dataset.invite){sessionStorage.setItem('bcc_event_draft',JSON.stringify({name:item.name,date:item.date,time:item.time,venue:item.venue,message:item.message}));location.href='invitation.html'}if(b.dataset.delete&&confirm('Delete this church event?')){try{await deleteDoc(doc(db,'churchEvents',id));await load()}catch(err){$('eventStatus').textContent=err.message}}};
$('eventForm').onsubmit=async e=>{e.preventDefault();if(!ready)return;const id=$('eventId').value||crypto.randomUUID(),data={name:$('name').value.trim(),type:$('type').value,date:$('date').value,time:$('time').value,venue:$('venue').value.trim(),message:$('message').value.trim(),updatedAt:new Date().toISOString()};$('save').disabled=true;try{await setDoc(doc(db,'churchEvents',id),data);$('eventStatus').textContent='Event saved to Firebase.';clear();$('eventDialog').close();await load()}catch(err){$('eventStatus').textContent='Save failed: '+err.message}finally{$('save').disabled=false}};
function clear(){$('eventForm').reset();$('eventId').value='';$('venue').value='Baptist City Church';$('formTitle').textContent='Add Church Event'}$('reset').onclick=clear;

let cursor=new Date(),mode='month',picked=new Date();
const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const monthLabel=d=>d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
function renderOverview(){
 const mini=$('miniGrid'),title=$('miniTitle');if(!mini)return;
 title.textContent=monthLabel(cursor);const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),last=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
 const days=['S','M','T','W','T','F','S'];mini.innerHTML=days.map(x=>`<span style="text-align:center;color:#777;font-size:11px">${x}</span>`).join('')+Array.from({length:first.getDay()},()=>'<span></span>').join('')+Array.from({length:last},(_,i)=>{const d=new Date(cursor.getFullYear(),cursor.getMonth(),i+1),k=key(d);return `<button type="button" class="${k===key(new Date())?'mini-selected':''}" data-mini="${k}">${i+1}</button>`}).join('');
 const upcoming=records.filter(r=>r.date>=key(new Date())).slice(0,6);
 $('upcomingItems').innerHTML=upcoming.length?upcoming.map(r=>`<div class="upcoming-item"><span class="upcoming-dot" style="background:${color(r.type)}"></span><div><strong>${esc(r.name)}</strong><small>${esc(pretty(r.date))} · ${esc(prettyTime(r.time))}</small></div></div>`).join(''):'<p style="font-size:12px">No upcoming events yet. Click Create Event to start planning.</p>';
 const types=['Sunday Worship','Prayer Meeting','Bible Study','Youth Fellowship','Fellowship','Special Service','Other'];$('eventLegend').innerHTML=types.map(t=>`<div class="legend-row"><span class="legend-dot" style="background:${color(t)}"></span>${esc(t)}</div>`).join('');
}
$('miniGrid').addEventListener('click',e=>{const b=e.target.closest('[data-mini]');if(b)showForm(b.dataset.mini)});
$('miniPrev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderCalendar()};
$('miniNext').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderCalendar()};
function renderCalendar(){
 renderOverview();
 const el=$('calendarGrid');if(!el)return;
 $('period').textContent=mode==='month'?monthLabel(cursor):mode==='week'?'Week of '+cursor.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):cursor.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));
 let dates=[];
 if(mode==='month'){const first=new Date(cursor.getFullYear(),cursor.getMonth(),1);const start=new Date(first);start.setDate(1-first.getDay());for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);dates.push(d)}}
 if(mode==='week'){const start=new Date(cursor);start.setDate(start.getDate()-start.getDay());for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);dates.push(d)}}
 if(mode==='day')dates=[new Date(cursor)];
 const dayLabels=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 el.className='calendar-grid '+mode;
 el.innerHTML=(mode!=='day'?dayLabels.map(d=>'<div class="weekday">'+d+'</div>').join(''):'')+dates.map(d=>{
 const date=key(d),ev=records.filter(r=>r.date===date),outside=mode==='month'&&d.getMonth()!==cursor.getMonth();
 return `<div class="day ${outside?'outside':''} ${date===key(new Date())?'today':''}" data-day="${date}" tabindex="0" role="button" aria-label="Plan ${date}"><div class="day-number">${d.getDate()} <span class="add-small">＋</span></div><div class="day-events">${ev.map(r=>`<button type="button" draggable="true" class="event-chip" data-event="${esc(r.id)}" style="--chip:${color(r.type)}" title="Drag to reschedule">${esc(prettyTime(r.time))} · ${esc(r.name)}</button>`).join('')}</div></div>`}).join('');
}
function color(type){return {'Sunday Worship':'#7456d8','Prayer Meeting':'#258ce0','Bible Study':'#24ad83','Youth Fellowship':'#e54c8d','Fellowship':'#cf7a25','Special Service':'#c34d78'}[type]||'#4e7bb8'}
function showForm(date,id){let r=records.find(x=>x.id===id);clear();if(r){for(const k of ['name','type','date','time','venue','message'])$(k).value=r[k]||'';$('eventId').value=r.id;$('formTitle').textContent='Edit Church Event'}else{$('date').value=date||key(new Date());$('time').value='09:00'}$('eventDialog').showModal()}
$('calendarGrid').addEventListener('click',e=>{const chip=e.target.closest('[data-event]');if(chip){showForm(null,chip.dataset.event);return}const day=e.target.closest('[data-day]');if(day)showForm(day.dataset.day)});
$('calendarGrid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-day]')){e.preventDefault();showForm(e.target.dataset.day)}});
$('calendarGrid').addEventListener('dragstart',e=>{const chip=e.target.closest('[data-event]');if(chip)e.dataTransfer.setData('text/plain',chip.dataset.event)});
$('calendarGrid').addEventListener('dragover',e=>{if(e.target.closest('[data-day]'))e.preventDefault()});
$('calendarGrid').addEventListener('drop',async e=>{const day=e.target.closest('[data-day]');if(!day)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');const r=records.find(x=>x.id===id);if(!r||r.date===day.dataset.day)return;try{await setDoc(doc(db,'churchEvents',id),{...r,date:day.dataset.day,updatedAt:new Date().toISOString()});await load()}catch(err){$('eventStatus').textContent='Move failed: '+err.message}});
$('prev').onclick=()=>{if(mode==='month')cursor.setMonth(cursor.getMonth()-1);else cursor.setDate(cursor.getDate()-(mode==='week'?7:1));cursor=new Date(cursor);renderCalendar()};
$('next').onclick=()=>{if(mode==='month')cursor.setMonth(cursor.getMonth()+1);else cursor.setDate(cursor.getDate()+(mode==='week'?7:1));cursor=new Date(cursor);renderCalendar()};
$('today').onclick=()=>{cursor=new Date();renderCalendar()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderCalendar()});
$('newEvent').onclick=()=>showForm(key(new Date()));
$('closeDialog').onclick=()=>$('eventDialog').close();
$('inviteFromPlanner').onclick=()=>{const data={name:$('name').value,date:$('date').value,time:$('time').value,venue:$('venue').value,message:$('message').value};sessionStorage.setItem('bcc_event_draft',JSON.stringify(data));location.href='invitation.html'};
$('deleteFromPlanner').onclick=async()=>{const id=$('eventId').value;if(!id)return alert('Save this event before deleting.');if(!confirm('Delete this church event?'))return;try{await deleteDoc(doc(db,'churchEvents',id));$('eventDialog').close();await load()}catch(err){$('eventStatus').textContent=err.message}};
$('search').addEventListener('input',()=>{const q=$('search').value.toLowerCase();document.querySelectorAll('.event-chip').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))});
renderCalendar();
// Keep form reset separate from closing the dialog; saving closes it explicitly.
</script></body></html>
